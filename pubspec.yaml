name: injectable_example
description: "An interactive showcase of the injectable package for Dart & Flutter dependency injection."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^7.7.0
  injectable: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.4.4
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
